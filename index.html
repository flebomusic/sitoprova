    <title>Flebo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            text-align: center;
        }

        h1 {
            color: red;
            font-size: 4rem;
            margin-bottom: 10px;
        }

            color: #ccc;
            font-size: 1.5rem;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Flebo</h1>
